name: ci

# 一条流水线两件事：
#   check  —— push / PR 都跑：typecheck + lint + 全部测试
#   deploy —— 只有 main 的 push（或手动触发）才发布到 Cloudflare Pages
# 部署走 GitHub Actions 直传（不让 Cloudflare 自己构建）：测试不过就不发布，
# 项目与域名保持不变。为什么不「连 Git 仓库」：直传项目无法事后改成 Git 集成，
# 见 DEPLOY.md「push 即部署」一节。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支只保留最新一次运行：连续 push 文档改动时不浪费机器
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 不写 version：action 读 package.json 的 packageManager 字段
      # （两者同时给出会报 "Multiple versions of pnpm specified"）
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  deploy:
    needs: check
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # 直传：--branch=main 让这次部署算「生产部署」，项目域名随之更新
      # 需要仓库 Secrets：CLOUDFLARE_API_TOKEN（Pages 编辑权限）、CLOUDFLARE_ACCOUNT_ID
      - name: 发布到 Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler pages deploy apps/studio/dist --project-name=layered-circuits --branch=main --commit-dirty=true
