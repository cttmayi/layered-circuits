name: ci

# 只跑质量门：push / PR 都执行 `pnpm check`（typecheck + lint + 全部测试）。
# 部署是手动的（`pnpm deploy:cf`）—— 为什么不自动部署，见 DEPLOY.md「（可选）让 git push 自动部署」。
# 保留 CI 的价值：第一次跑就抓出了本地被掩盖的类型错误（见 commit d0d39fe）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支只保留最新一次运行：连续 push 文档改动时不浪费机器
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 不写 version：action 读 package.json 的 packageManager 字段
      # （两者同时给出会报 "Multiple versions of pnpm specified"）
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
